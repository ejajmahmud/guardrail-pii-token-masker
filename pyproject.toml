[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-pii-token-masker"
version = "0.1.0"
description = "High-throughput token stream scanner redacting PII, credentials, and sensitive customer data before LLM dispatch"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
guardrail-pii-token-masker = "guardrail_pii_token_masker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardrail_pii_token_masker*"]
